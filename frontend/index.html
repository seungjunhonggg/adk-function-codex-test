<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- 기본 메타 설정 -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MLCC Agent Demo</title>
    <!-- 폰트 로드 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- 스타일 시트 연결 -->
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <!-- 전체 앱 레이아웃 -->
    <div class="app is-insights-hidden">
      <!-- 좌측 네비게이션 -->
            <aside class="nav">
        <button class="nav__action" id="newChatButton" type="button">
          New chat
        </button>
      </aside>

      <!-- 중앙 채팅 영역 -->
      <main class="chat">
        <header class="topbar">
          <div class="topbar__left">
            <div class="topbar__badge">ChatGPT-style UI</div>
            <div class="topbar__title">MLCC Assistant</div>
          </div>
          <div class="topbar__right">
            <div class="topbar__status">
              <span class="dot dot--green"></span>
              <span>Connected</span>
            </div>
            <button class="ghost-btn" id="clearButton" type="button">
              Clear
            </button>
            <button
              class="panel-toggle"
              id="insightsToggle"
              type="button"
              aria-label="Toggle panel"
            >
              &gt;
            </button>
          </div>
        </header>

        <!-- 메시지 스레드 -->
        <section class="thread" id="thread">
          
        </section>

        <!-- 입력 영역 -->
        <form class="composer" id="composer">
          <div class="composer__container">
            <textarea
              id="messageInput"
              rows="1"
              placeholder="Ask anything about MLCC workflow..."
            ></textarea>
            <div class="composer__toolbar">
              <div class="composer__tools"></div>
              <button class="send-btn" id="sendButton" type="submit" aria-label="Send">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M3 12l18-9-4.5 9L21 21 3 12z"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M3 12l13.5 0"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                  />
                </svg>
              </button>
            </div>
          </div>
        </form>
      </main>

      <!-- 우측 상태 패널 -->
      <aside class="insights">
        <div class="insights__header">
          <div class="insights__title">Run status</div>
          <div class="insights__subtitle">Planner panel</div>
        </div>
        <div class="insights__card">
          <div class="insights__label">Session</div>
          <div class="insights__value" id="sessionId">-</div>
        </div>
        <div class="insights__card">
          <div class="insights__label">Demo mode</div>
          <label class="toggle">
            <input type="checkbox" id="demoToggle" />
            <span class="toggle__track"></span>
          </label>
        </div>
        <div class="insights__card">
          <div class="insights__label">Pipeline</div>
          <div class="stage-list">
            <div class="stage-row">
              <span>1-1 Input</span>
              <span class="stage-dot is-idle"></span>
            </div>
            <div class="stage-row">
              <span>1-2 Chip</span>
              <span class="stage-dot is-idle"></span>
            </div>
            <div class="stage-row">
              <span>1-3 Ref Lot</span>
              <span class="stage-dot is-idle"></span>
            </div>
            <div class="stage-row">
              <span>1-4 Payload</span>
              <span class="stage-dot is-idle"></span>
            </div>
            <div class="stage-row">
              <span>1-5 Top-K</span>
              <span class="stage-dot is-idle"></span>
            </div>
            <div class="stage-row">
              <span>1-6 Recent</span>
              <span class="stage-dot is-idle"></span>
            </div>
            <div class="stage-row">
              <span>1-7 Defect</span>
              <span class="stage-dot is-idle"></span>
            </div>
            <div class="stage-row">
              <span>1-8 Brief</span>
              <span class="stage-dot is-idle"></span>
            </div>
          </div>
        </div>
        <div class="insights__card insights__card--skeleton">
          <div class="skeleton-line"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line"></div>
        </div>
      </aside>
    </div>

    <!-- 스크립트 로드 -->
    <script src="/static/a2ui-renderer.js" defer></script>
    <script src="/static/app.js" defer></script>
  </body>
</html>
